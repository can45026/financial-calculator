<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TI BA II Plus Classroom Emulator</title>
    <style>
        body { font-family: 'Arial', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #e4e7eb; margin: 0; }
        
        /* Main Body Shell matching your image */
        .calculator { background: #232528; border: 4px solid #141517; border-radius: 24px 24px 60px 60px; padding: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 330px; box-sizing: border-box; }
        
        /* Logo Header Section */
        .header-panel { text-align: center; margin-bottom: 12px; color: #ffffff; }
        .brand-name { font-size: 24px; font-weight: bold; font-style: italic; font-family: 'Times New Roman', serif; margin: 0; }
        .sub-brand { font-size: 11px; letter-spacing: 2px; color: #a0a5aa; margin: 2px 0 0 0; text-transform: uppercase; }
        
        /* LCD Screen Area */
        .screen-container { background: #b0c2ba; border: 6px solid #55595d; border-radius: 8px; padding: 10px; margin-bottom: 18px; box-shadow: inset 0 4px 10px rgba(0,0,0,0.3); }
        .indicators { font-family: monospace; font-size: 10px; color: #33423a; display: flex; justify-content: space-between; height: 12px; font-weight: bold; margin-bottom: 2px; }
        .lcd-main { color: #151e19; font-family: 'Courier New', monospace; font-weight: bold; font-size: 32px; text-align: right; letter-spacing: 1px; min-height: 38px; word-wrap: break-word; }
        
        /* Keypad Layout */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px 10px; }
        
        /* Standard Key Wrapper containing the secondary label + button */
        .key-wrapper { display: flex; flex-direction: column; align-items: center; }
        .secondary-label { color: #cc7a00; font-size: 10px; font-weight: bold; text-align: center; height: 14px; margin-bottom: 3px; text-transform: uppercase; white-space: nowrap; }
        .secondary-label.white-lbl { color: #ffffff; }
        
        /* Base Button Styling */
        button { width: 100%; height: 32px; border-radius: 6px; border: none; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-sizing: border-box; transition: transform 0.05s, box-shadow 0.05s; }
        button:active { transform: translateY(2px); }
        
        /* Dark Function Keys (CPT, ENTER, Arrows, Math Operators) */
        .btn-dark { background: #3a3d40; color: #ffffff; border-bottom: 3px solid #202224; }
        .btn-dark:active { border-bottom: 1px solid #202224; }
        
        /* White Key Group (Numbers 0-9, Decimal) */
        .btn-white { background: #ffffff; color: #232528; border-bottom: 3px solid #bcbfc2; font-size: 16px; }
        .btn-white:active { border-bottom: 1px solid #bcbfc2; }
        
        /* Yellow 2ND Key */
        .btn-yellow { background: #edd37d; color: #232528; border-bottom: 3px solid #bfa44e; }
        .btn-yellow:active { border-bottom: 1px solid #bfa44e; }
        
        /* Distinctive Bottom Row Curvature Styles */
        .left-bottom-corner { border-radius: 6px 6px 6px 25px; }
        .right-bottom-corner { border-radius: 6px 6px 25px 6px; }
    </style>
</head>
<body>

<div class="calculator">
    <div class="header-panel">
        <div class="brand-name">BA II Plus</div>
        <div class="sub-brand">Business Analyst</div>
    </div>
    
    <div class="screen-container">
        <div class="indicators">
            <span id="ind-2nd"></span>
            <span id="ind-status">READY</span>
        </div>
        <div class="lcd-main" id="display">0.00</div>
    </div>
    
    <div class="keypad">
        <!-- Row 1 -->
        <div class="key-wrapper"><div class="secondary-label">QUIT</div><button class="btn-dark" onclick="pressCPT()">CPT</button></div>
        <div class="key-wrapper"><div class="secondary-label">SET</div><button class="btn-dark" onclick="pressEnter()">ENTER</button></div>
        <div class="key-wrapper"><div class="secondary-label">DEL</div><button class="btn-dark">↑</button></div>
        <div class="key-wrapper"><div class="secondary-label">INS</div><button class="btn-dark">↓</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark" style="background:#5e6266;" onclick="clearAll()">ON/OFF</button></div>

        <!-- Row 2 -->
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-yellow" onclick="press2nd()">2ND</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">CF</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">NPV</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">IRR</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">→</button></div>

        <!-- Row 3 (TVM Row) -->
        <div class="key-wrapper"><div class="secondary-label">xP/Y</div><button class="btn-white" onclick="storeTVM('N')">N</button></div>
        <div class="key-wrapper"><div class="secondary-label">P/Y</div><button class="btn-white" onclick="storeTVM('IY')">I/Y</button></div>
        <div class="key-wrapper"><div class="secondary-label">AMORT</div><button class="btn-white" onclick="storeTVM('PV')">PV</button></div>
        <div class="key-wrapper"><div class="secondary-label">BGN</div><button class="btn-white" onclick="storeTVM('PMT')">PMT</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">CLR TVM</div><button class="btn-white" onclick="clearTVM()">FV</button></div>

        <!-- Row 4 -->
        <div class="key-wrapper"><div class="secondary-label">K</div><button class="btn-dark">%</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">√x</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">x²</button></div>
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark">1/x</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">RAND</div><button class="btn-dark" onclick="pressOp('/')">÷</button></div>

        <!-- Row 5 -->
        <div class="key-wrapper"><div class="secondary-label">HYP</div><button class="btn-dark">INV</button></div>
        <div class="key-wrapper"><div class="secondary-label">SIN</div><button class="btn-dark">(</button></div>
        <div class="key-wrapper"><div class="secondary-label">COS</div><button class="btn-dark">)</button></div>
        <!-- FIXED: Button face text corrected from yⁿ to yˣ -->
        <div class="key-wrapper"><div class="secondary-label">TAN</div><button class="btn-dark" onclick="pressOp('pow')">yˣ</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">x!</div><button class="btn-dark" onclick="pressOp('*')">×</button></div>

        <!-- Row 6 -->
        <!-- FIXED: Secondary label corrected from ex to eˣ -->
        <div class="key-wrapper"><div class="secondary-label">eˣ</div><button class="btn-dark" onclick="pressLN()">LN</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">DATA</div><button class="btn-white">7</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">STAT</div><button class="btn-white">8</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">BOND</div><button class="btn-white">9</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">nPr</div><button class="btn-dark" onclick="pressOp('-')">−</button></div>

        <!-- Row 7 -->
        <div class="key-wrapper"><div class="secondary-label">ROUND</div><button class="btn-dark" onclick="storeTVM('STO')">STO</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">DEPR</div><button class="btn-white">4</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">Δ%</div><button class="btn-white">5</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">BRKEVN</div><button class="btn-white">6</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">nCr</div><button class="btn-dark" onclick="pressOp('+')">+</button></div>

        <!-- Row 8 -->
        <div class="key-wrapper"><div class="secondary-label"></div><button class="btn-dark" onclick="storeTVM('RCL')">RCL</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">DATE</div><button class="btn-white">1</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">ICONV</div><button class="btn-white">2</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">PROFIT</div><button class="btn-white">3</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">ANS</div><button class="btn-dark" style="font-size:11px;" onclick="pressEquals()">=</button></div>

        <!-- Row 9 -->
        <div class="key-wrapper"><div class="secondary-label">CLR WORK</div><button class="btn-dark left-bottom-corner" style="font-size:11px;" onclick="clearDisplay()">CE|C</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">MEM</div><button class="btn-white">0</button></div>
        <div class="key-wrapper"><div class="secondary-label white-lbl">FORMAT</div><button class="btn-white">.</button></div>
